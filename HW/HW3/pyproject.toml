[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli"
version = "1.0.0"
description = "A powerful CLI todo list manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.scripts]
todo = "todo_cli.main:cli"

[tool.setuptools.packages.find]
include = ["todo_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
